<template>
  <template lwc:if={diagnosis}>
    <section
      class="slds-box slds-theme_default slds-m-top_small"
      aria-label="Diagnosis result"
    >
      <h2 class="slds-text-heading_small" data-id="headline" tabindex="-1">
        {diagnosis.headline}
      </h2>
      <p class="slds-text-color_weak slds-m-top_xx-small" data-id="confidence">
        {confidenceText}
      </p>
      <template lwc:if={showComponent}>
        <p class="slds-m-top_xx-small" data-id="component">{componentText}</p>
      </template>

      <template lwc:if={explanation}>
        <p class="slds-m-top_small" data-id="summary">{explanation.summary}</p>
        <template lwc:if={hasSteps}>
          <h3 class="slds-text-title slds-m-top_small">What to do</h3>
          <ol class="slds-list_ordered">
            <template for:each={steps} for:item="step">
              <li key={step.key} data-id="step">{step.text}</li>
            </template>
          </ol>
        </template>
        <template lwc:if={hasSources}>
          <div class="slds-m-top_small" data-id="sources">
            <h3 class="slds-text-title">Based on</h3>
            <ul class="slds-list_dotted">
              <template for:each={citations} for:item="citation">
                <li key={citation.key} data-id="citation">{citation.text}</li>
              </template>
            </ul>
          </div>
        </template>
        <template lwc:if={showSource}>
          <p class="slds-text-color_weak slds-m-top_small" data-id="source">
            {sourceText}
          </p>
        </template>
      </template>

      <template lwc:if={showFollowUps}>
        <div class="slds-m-top_small" data-id="followups">
          <template for:each={followUpItems} for:item="item">
            <div key={item.key} class="slds-m-bottom_small">
              <p class="slds-text-title" data-id="followup-question">
                {item.question}
              </p>
              <p data-id="followup-answer">{item.summary}</p>
              <template lwc:if={item.hasSteps}>
                <ol class="slds-list_ordered">
                  <template for:each={item.steps} for:item="step">
                    <li key={step.key}>{step.text}</li>
                  </template>
                </ol>
              </template>
            </div>
          </template>
          <template lwc:if={canAskFollowUp}>
            <lightning-input
              data-id="followup-input"
              label="Ask a follow-up question"
              maxlength="500"
              value={question}
              onchange={handleQuestionChange}
            ></lightning-input>
            <lightning-button
              class="slds-m-top_x-small"
              data-id="followup-ask"
              label="Ask"
              variant="neutral"
              disabled={askDisabled}
              onclick={handleAsk}
            ></lightning-button>
          </template>
          <template lwc:if={limitReached}>
            <p class="slds-text-color_weak" data-id="followup-limit">
              No more follow-up questions for this problem. Ask your admin for
              more help.
            </p>
          </template>
        </div>
      </template>

      <template lwc:if={showFeedback}>
        <div class="slds-m-top_small">
          <template lwc:if={feedbackGiven}>
            <p data-id="thanks">Thanks for letting us know.</p>
          </template>
          <template lwc:else>
            <p class="slds-m-bottom_x-small">Did this solve your problem?</p>
            <lightning-button
              data-id="solved"
              label="Yes, solved"
              variant="brand-outline"
              disabled={busy}
              onclick={handleSolved}
            ></lightning-button>
            <lightning-button
              class="slds-m-left_x-small"
              data-id="not-solved"
              label="No, still stuck"
              variant="neutral"
              disabled={busy}
              onclick={handleNotSolved}
            ></lightning-button>
          </template>
        </div>
      </template>

      <template lwc:if={showReportButton}>
        <div class="slds-m-top_small">
          <lightning-button
            data-id="report"
            label="Prepare a report for my admin"
            variant="brand"
            disabled={busy}
            onclick={handleReport}
          ></lightning-button>
        </div>
      </template>
    </section>
  </template>
</template>
